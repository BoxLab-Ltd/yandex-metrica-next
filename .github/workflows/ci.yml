name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            # The only third-party action in this workflow, so the only floating tag that
            # is ours to vouch for; GitHub's own actions ship immutable tags.
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            # 22.22.2 is the floor imposed by the toolchain: jsdom@30 wants ^22.22.2,
            # tsdown and size-limit ^22.18.0. The package itself still supports Node 20.9.
            - uses: actions/setup-node@v6
              with:
                  node-version: 22.22.2
            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run format:check
            - run: bun run build
            - run: bun run test
            - run: bun run lint:pkg
            - name: attw
              run: |
                  bun pm pack
                  bunx attw ./*.tgz
            - run: bun run test:types
            - uses: actions/upload-artifact@v4
              with:
                  name: tarball
                  path: ./*.tgz
                  if-no-files-found: error

    # React 18 is swapped in by installing it, not by aliasing the resolver: CJS packages
    # are externalised and their internal require('react') walks past any bundler alias,
    # which produces a mixed-version tree that fails in ways unrelated to the code.
    react18:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - uses: actions/setup-node@v6
              with:
                  node-version: 22.22.2
            - run: bun install --frozen-lockfile
            # The dual-build test reads dist, so the artifacts have to exist first.
            - run: bun run build
            - run: bun run test:react18

    # engines promises Node 20.9 but the toolchain needs 22: the tarball is loaded on 20.9 alone.
    smoke-node20:
        needs: build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v6
              with:
                  node-version: 20.9.0
            - uses: actions/download-artifact@v4
              with:
                  name: tarball
            - run: node scripts/smoke-node.mjs ./*.tgz

    e2e-cells:
        runs-on: ubuntu-latest
        outputs:
            cells: ${{ steps.cells.outputs.cells }}
        steps:
            - uses: actions/checkout@v5
            - id: cells
              run: echo "cells=$(node scripts/e2e.mjs matrix)" >> "$GITHUB_OUTPUT"

    e2e:
        name: e2e (${{ matrix.cell }})
        needs: [build, e2e-cells]
        runs-on: ubuntu-latest
        timeout-minutes: 20
        strategy:
            fail-fast: false
            matrix:
                cell: ${{ fromJSON(needs.e2e-cells.outputs.cells) }}
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - uses: actions/setup-node@v6
              with:
                  node-version: 22.22.2
            - run: bun install --frozen-lockfile
            # The very tarball the build job verified, not a rebuild that could differ from it.
            - uses: actions/download-artifact@v4
              with:
                  name: tarball
            - id: playwright
              run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
            - uses: actions/cache@v4
              with:
                  path: ~/.cache/ms-playwright
                  key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
            - run: bunx playwright install --with-deps chromium
            - name: run cell
              env:
                  CELL: ${{ matrix.cell }}
              run: node scripts/e2e.mjs run "$CELL" --tarball "$(ls "$GITHUB_WORKSPACE"/*.tgz)"
            - uses: actions/upload-artifact@v4
              if: failure()
              with:
                  name: playwright-${{ matrix.cell }}
                  path: test-results/
                  if-no-files-found: ignore
