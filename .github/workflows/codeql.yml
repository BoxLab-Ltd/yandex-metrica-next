name: CodeQL

on:
    push:
        branches: [main]
    pull_request:
    schedule:
        - cron: '31 4 * * 1'

permissions:
    contents: read
    security-events: write

jobs:
    analyze:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: github/codeql-action/init@v3
              with:
                  # `actions` covers the workflow files themselves — that is the analysis
                  # that caught an unpinned third-party action here, and dropping it would
                  # leave the release path unscanned.
                  languages: javascript-typescript, actions
            - uses: github/codeql-action/analyze@v3
