name: Release

on:
    release:
        types: [created]

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            # Actions are pinned by SHA only in this workflow: it is the single place that
            # can publish under the package name. A hijacked floating tag here would ship
            # arbitrary code with valid provenance.
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
            - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
              with:
                  bun-version: latest
            - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: 22.22.2
                  registry-url: https://registry.npmjs.org

            - name: Guard tag against manifest version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "$PKG" ]; then
                    echo "::error::tag v$TAG does not match package.json version $PKG"
                    exit 1
                  fi
                  echo "version guard ok: $PKG"

            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run build
            - run: bun run lint:pkg
            - run: bun run test:types
            - name: attw
              run: |
                  bun pm pack
                  bunx attw ./*.tgz

            # Trusted Publishing (OIDC) generates provenance on its own; no token, no --provenance.
            - run: npm publish --dry-run
