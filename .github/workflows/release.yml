name: Release

on:
    release:
        types: [published]

permissions:
    contents: read

jobs:
    publish:
        runs-on: ubuntu-latest
        environment: release
        permissions:
            contents: read
            id-token: write
        steps:
            # Every action is pinned by SHA here, GitHub's own included: this is the single
            # place that can publish under the package name, and a hijacked floating tag
            # would ship arbitrary code carrying valid provenance. Other workflows pin only
            # third-party actions.
            - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
            - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
              with:
                  bun-version: latest
            - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
              with:
                  node-version: 22.22.2
                  registry-url: https://registry.npmjs.org

            - name: Guard tag against manifest version
              run: |
                  TAG="${GITHUB_REF_NAME#v}"
                  PKG=$(node -p "require('./package.json').version")
                  if [ "$TAG" != "$PKG" ]; then
                    echo "::error::tag v$TAG does not match package.json version $PKG"
                    exit 1
                  fi
                  echo "version guard ok: $PKG"

            - run: bun install --frozen-lockfile
            - run: bun run typecheck
            - run: bun run lint
            - run: bun run build
            - run: bun run test
            - run: bun run lint:pkg
            - run: bun run test:types
            - name: attw
              run: |
                  bun pm pack
                  bunx attw ./*.tgz

            # Node 22 bundles npm 10.x, which cannot authenticate by OIDC at all.
            # Trusted Publishing needs >= 11.5.1; pinned rather than @latest because this
            # is the one workflow holding id-token: write.
            - run: npm install -g npm@11.18.0
            # Trusted Publishing (OIDC) generates provenance on its own; no token, no
            # --provenance. The version check keeps a re-run safe: the registry refuses to
            # overwrite a version, so a release that failed after this step could never be
            # retried otherwise.
            - name: Publish to npm (skip when the version is already there)
              run: |
                  VERSION="$(node -p "require('./package.json').version")"
                  if npm view "@boxlab/yandex-metrica-next@${VERSION}" version >/dev/null 2>&1; then
                    echo "@boxlab/yandex-metrica-next@${VERSION} is already published — skipping"
                  else
                    npm publish --ignore-scripts
                  fi
