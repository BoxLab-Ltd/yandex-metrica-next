version: 2
updates:
    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      # A freshly published version is where a hijacked release lives; five days lets the registry catch it.
      cooldown:
          default-days: 5
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]
      ignore:
          # Types follow the Node the toolchain runs on (22), not the newest release.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # typescript-eslint 8 refuses TS 7; lift this once it supports it.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 5
